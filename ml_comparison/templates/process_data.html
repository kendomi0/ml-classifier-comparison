<!DOCTYPE html>
<html>
<head>
    <title>Number of Top Combinations to View | {{ WEBSITE_NAME }} </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/b3ffa80bf4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/output.css') }}">
</head>
<body>
    <div class="loading-screen h-screen hidden">
        <div class="loading-screen-tagline max-w-9/10 flex flex-col items-center-safe gap-5 lg:flex-row">
            <span class="loading loading-spinner loading-xl"></span>
            <div class="text-5xl text-center">
                Generating combination...
            </div>
        </div>
    </div>
    <form method="POST" action="/display">
        <div class="flex flex-col h-screen justify-center-safe items-center gap-2">
            <input type="hidden" name="results_key" value="{{ results_key }}">
            <input type="hidden" name="dataset" value="{{ dataset }}">
            <input type="hidden" name="plot_key" value="{{ plot_key }}">
            <input type="hidden" name="hidden_inputs_key" value="{{ hidden_inputs_key }}">
            <input type="hidden" id="total-combinations" value="{{ results_length }}">
            <div class="website-name" data-website-name="{{ WEBSITE_NAME }}" hidden></div>
            
            <div class="flex flex-col max-w-1/2">
                <div class="w-fit self-center flex flex-col justify-content gap-5">
                    <p class="text-center text-4xl font-semibold mb-5">How many results would you like to view?</p>
                    <button type="submit" id="all-combos-btn" name="number-of-combos" value="all" class="self-stretch btn btn-lg text-xl rounded-2xl border-purple-accent-border bg-medium-slate-blue-600 text-white 
            shadow-lg shadow-medium-slate-blue-500 duration-120 ease-in hover:bg-medium-slate-blue-700">
                        View all {{ results_length }} results
                    </button>
                    <div class="divider font-semibold">or</div>
                    <div class="flex flex-col items-stretch lg:flex-row gap-2">
                        <button type="button" id="numeric-combos-btn" class="btn btn-lg text-xl whitespace-nowrap cursor-default pointer-events-none rounded-3xl border-[1.5px] border-zinc-200 px-5 py-3 grow">
                            Enter a number of results
                        </button>
                        <input type="number" id="numeric-combos-input" name="number-of-combos" min="1" max="{{ results_length }}" class="border border-primary rounded-3xl h-full input input-xl py-2 w-full [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" required>
                        <button type="submit" id="submit-combos-btn" value="submit" class="btn btn-lg text-xl rounded-2xl border-purple-accent-border bg-medium-slate-blue-600 text-white 
            shadow-lg shadow-medium-slate-blue-500 duration-120 ease-in hover:bg-medium-slate-blue-700">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <script type="module" src="{{ url_for('static', filename='../static/process_data.js') }}"></script>
</body>
</html>
