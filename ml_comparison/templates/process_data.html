<!DOCTYPE html>
<html>
<head>
    <title>Number of Top Combinations to View | {{ WEBSITE_NAME }} </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/b3ffa80bf4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/output.css') }}">
</head>
<body>
    <div class="loading-screen w-screen h-screen hidden">
        <div class="loading-screen-tagline max-w-9/10 flex flex-col gap-1 sm:flex-row">
            <i class="fa-solid fa-circle-notch text-5xl self-center animate-spin mr-1"></i>
            <div class="text-5xl text-center tracking-tighter">
                Generating combination...
            </div>
        </div>
    </div>
    <form method="POST" action="/display">
        <div class="flex flex-col h-screen justify-center gap-2">
            <input type="hidden" name="results_key" value="{{ results_key }}">
            <input type="hidden" name="dataset" value="{{ dataset }}">
            <input type="hidden" name="plot_key" value="{{ plot_key }}">
            <input type="hidden" name="hidden_inputs_key" value="{{ hidden_inputs_key }}">
            <input type="hidden" id="total-combinations" value="{{ results_length }}">
            <div class="website-name" data-website-name="{{ WEBSITE_NAME }}" hidden></div>
            
            <p class="text-center self-center text-3xl max-w-2/3 tracking-tight mb-3">
                How many of the top combinations would you like to see out of {{ results_length }} total combination{% if results_length > 1 %}s{% endif %}?
            </p>
            
            <div class="w-fit self-center flex flex-col justify-content gap-5">
                <div class="flex flex-col sm:flex-row gap-2 item-stretch">
                    <button type="button" id="numeric-combos-btn" class="self-center btn btn-xl whitespace-nowrap tracking-wide rounded-3xl bg-base-300 text-base-content">
                        Enter a number of combinations
                    </button>
                    <input type="number" id="numeric-combos-input" name="number-of-combos" min="1" max="{{ results_length }}" class="hidden border border-primary rounded-3xl w-fit h-full self-center" required>
                    <button type="submit" id="submit-combos-btn" value="submit" class="hidden w-fit self-center btn btn-xl rounded-3xl tracking-wide bg-base-300 text-base-content">Submit</button>
                </div>
                <button type="submit" id="all-combos-btn" name="number-of-combos" value="all" class="max-w-7/8 self-center btn btn-xl rounded-3xl tracking-wide bg-base-300 text-base-content">
                    Choose all combinations
                </button>
            </div>
        </div>
    </form>
    <script type="module" src="{{ url_for('static', filename='../static/process_data.js') }}"></script>
</body>
</html>
