<!DOCTYPE html>
<html>
<head>
    <title>{{ WEBSITE_NAME }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/b3ffa80bf4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/output.css') }}">
</head>
<body>
    <main class="flex flex-col h-screen justify-center items-center gap-8">
        <div class="flex flex-col items-center gap-8 max-w-2/5">
            <h1 class="text-6xl sm:text-7xl text-center font-semibold">
                {{ WEBSITE_NAME }}
            </h1>
            <p class="text-2xl text-center">
                Compare how <span class="text-purple-accent">4</span> evaluation methods, <span class="text-purple-accent">5</span> classifiers, and <span class="text-purple-accent">3</span> normalization options perform on <span class="text-purple-accent">5</span> datasets.
            </p>
            <button class="btn w-fit btn-xl text-2xl rounded-2xl border-purple-accent-border bg-purple-accent text-white 
            shadow-lg shadow-purple-accent-lighter whitespace-nowrap duration-120 ease-in hover:bg-purple-accent-darker transition" onclick="document.location='/dataset'">Select Options
                <i class="fa-solid fa-arrow-right pl-2"></i>
            </button>
        </div>
