<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ WEBSITE_NAME }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/b3ffa80bf4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/output.css') }}">
</head>
<body>
    <site-header></site-header>
    <script src="{{ url_for('static', filename='./header.js') }}"></script>
    <main class="flex flex-col flex-1 justify-center items-center gap-8 py-8">
        <div class="flex flex-col items-center gap-8 max-w-2/5">
            <h1 class="text-6xl sm:text-7xl text-center font-semibold">
                {{ WEBSITE_NAME }}
            </h1>
            <p class="text-2xl text-center">
                Compare how <span class="text-accent-main">4</span> evaluation methods, <span class="text-accent-main">5</span> classifiers, and <span class="text-accent-main">3</span> normalization options perform on <span class="text-accent-main">5</span> datasets.
            </p>
            <button class="btn w-fit btn-xl text-2xl rounded-2xl border-accent-border bg-accent-main text-main-button-text
         shadow-button-shadow shadow-lg whitespace-nowrap duration-120 ease-in hover:bg-accent-5 transition" onclick="document.location='/selection'">Select Options
                <i class="fa-solid fa-arrow-right pl-2"></i>
            </button>
        </div>
    </main>

</html>
